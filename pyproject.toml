[project]
name = "momants-sentiment-notebook"
version = "0.1.0"
description = "Leeromgeving voor Momants tekstclassificatie"
requires-python = ">=3.11,<3.12"
dependencies = [
    "ipykernel>=7.3.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.3",
    "lingua-language-detector>=2.1.1",
    "pandas>=3.0.5",
    "sentence-transformers>=5.7.0",
    "setfit>=1.1.3",
    "torch>=2.13.0",
    "transformers>=4.57.1,<5",
]

[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]